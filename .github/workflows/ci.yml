name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$RUNNER_TEMP/ocicl"
          ( cd "$RUNNER_TEMP/ocicl" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Configure ~/.sbclrc so plain `sbcl` loads the ocicl runtime (which
          # provides ASDF and resolves systems from ocicl.csv) and searches cwd.
          cat > "$HOME/.sbclrc" <<'RC'
          #-ocicl
          (when (probe-file #P"~/.local/share/ocicl/ocicl-runtime.lisp")
            (load #P"~/.local/share/ocicl/ocicl-runtime.lisp"))
          (asdf:initialize-source-registry
            (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))
          RC
          test -f "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            || { echo "ocicl-runtime.lisp not found"; ls -la "$HOME/.local/share/ocicl" || true; exit 1; }

      - name: Restore dependencies
        run: ocicl install

      - name: Run test suite
        run: sbcl --non-interactive --eval '(asdf:test-system :0conf)'

      - name: Build and smoke-test the CLI
        run: |
          ./scripts/build-cli.sh
          ./0conf help
          ./0conf browse            # no multicast on the runner -> exits 0 cleanly

      - name: Install Emacs (Linux, for tutorial tangling)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y emacs-nox

      - name: Tangle and run the literate tutorial
        if: runner.os == 'Linux'
        run: |
          emacs --batch --eval "(require 'org)" \
                --eval '(org-babel-tangle-file "doc/tutorial.org")'
          sbcl --non-interactive --load doc/tutorial.lisp

      - name: Test coverage report (Linux)
        if: runner.os == 'Linux'
        run: |
          sbcl --non-interactive --load scripts/coverage.lisp
          python3 scripts/coverage-summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: error
