name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$RUNNER_TEMP/ocicl"
          ( cd "$RUNNER_TEMP/ocicl" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: ocicl install

      - name: Run test suite
        run: sbcl --non-interactive --eval '(asdf:test-system :0conf)'
